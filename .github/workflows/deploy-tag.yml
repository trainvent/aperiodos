name: Deploy tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: production-cloud-run
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install application dependencies
        run: npm ci --prefix web

      - name: Select the production Rust toolchain
        run: |
          rustup toolchain install 1.93 --profile minimal
          rustup default 1.93

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.143

      - name: Install WebAssembly build tools
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --locked --version 0.2.127

      - name: Run the complete verification suite
        run: make check

  deploy:
    name: Deploy to Cloud Run
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: aperiodos
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: aperiodos

      - name: Deploy release
        env:
          PROJECT_ID: aperiodos
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          SKIP_PUBLIC_IAM_UPDATE: "1"
        run: ./deploy.sh

      - name: Record deployment
        env:
          PROJECT_ID: aperiodos
          REGION: europe-west1
          SERVICE_NAME: aperiodic-monotiles-generator
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          service_url="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          {
            echo "## Production deployment"
            echo
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Revision: \`$revision\`"
            echo "- URL: $service_url"
          } >> "$GITHUB_STEP_SUMMARY"
