[workspace]
members = [
    "src/generators/common",
    "src/generators/einstein",
    "src/generators/spectre",
    "src/generators/penrose",
    "src/generators/renderer",
    "src/generators/wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
aperiodos-render-core = { path = "src/generators/common" }
serde_json = "1.0"
wasm-bindgen = "0.2.105"
